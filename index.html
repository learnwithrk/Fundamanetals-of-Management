<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fundamentals of Management — Quiz Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="topbar"></div>

<div class="hero">
  <div class="container">
    <div class="eyebrow">Learn with RK</div>
    <h1>Fundamentals of Management, quiz by quiz.</h1>
    <p>Test yourself chapter by chapter. Every quiz saves your score to a shared leaderboard, and shows you exactly which questions to revisit.</p>
  </div>
</div>

<main>
  <div class="container">
    <div class="section-head"><h2>Available quizzes</h2><div class="rule"></div></div>
    <div id="quizList" class="quiz-list">
      <div class="empty-note">Loading quizzes…</div>
    </div>
  </div>
</main>

<footer>
  <div class="container">Fundamentals of Management — Quiz Hub</div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script>
  QuizApp.renderTopbar();

  (async function loadQuizzes() {
    const listEl = document.getElementById("quizList");
    try {
      const manifest = await (await fetch("quizzes/manifest.json")).json();
      if (!manifest.length) {
        listEl.innerHTML = `<div class="empty-note">No quizzes published yet — check back soon.</div>`;
        return;
      }
      listEl.innerHTML = manifest.map((q) => `
        <div class="quiz-card">
          <div class="num">${QuizApp.escapeHtml((q.title.match(/^[\d.]+/) || [""])[0] || "—")}</div>
          <div class="body">
            <h3>${QuizApp.escapeHtml(q.title)}</h3>
            <div class="meta">${q.subject ? QuizApp.escapeHtml(q.subject) + " · " : ""}${q.questionCount} questions</div>
          </div>
          <div class="actions">
            <a class="btn btn-ghost" href="leaderboard.html?id=${encodeURIComponent(q.id)}">Leaderboard</a>
            <a class="btn btn-primary" href="quiz.html?id=${encodeURIComponent(q.id)}">Start Quiz</a>
          </div>
        </div>
      `).join("");
    } catch (e) {
      listEl.innerHTML = `<div class="empty-note">Couldn't load the quiz list (${QuizApp.escapeHtml(e.message)}).</div>`;
    }
  })();
</script>
</body>
</html>
